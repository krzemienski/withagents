<!doctype html>
<html><head><meta charset="utf-8"><title>Type · Display</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Fraunces:ital,wght@1,400;1,500&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:18px}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.4px;color:rgba(244,243,238,0.4);text-transform:uppercase}
  .frx{font-family:Fraunces,serif;font-style:italic;color:#FF3D52;font-weight:500}
  h1{margin:0}
</style></head>
<body>
  <div>
    <div class="lbl">Hero · 88px · weight 800 · -3 tracking</div>
    <h1 style="font-size:88px;letter-spacing:-3px;font-weight:800;line-height:0.96">Agents that <span class="frx">hold up.</span></h1>
  </div>
  <div>
    <div class="lbl">Page · 56px · weight 800 · -2 tracking</div>
    <h1 style="font-size:56px;letter-spacing:-2px;font-weight:800;line-height:1.04">23,479 sessions, <span class="frx">documented.</span></h1>
  </div>
</body></html>
