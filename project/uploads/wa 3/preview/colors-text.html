<!doctype html>
<html><head><meta charset="utf-8"><title>Colors · Text scale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  body{margin:0;background:#08080a;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:14px}
  .row{display:flex;align-items:center;gap:18px}
  .swatch{width:28px;height:28px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);flex-shrink:0}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:1.4px;width:140px;flex-shrink:0;color:rgba(244,243,238,0.5)}
  .sample{font-size:15px;font-weight:500}
</style></head>
<body>
  <div class="row"><div class="swatch" style="background:#f4f3ee"></div><div class="lbl">--wa-fg</div><div class="sample" style="color:#f4f3ee">Primary text · 100%</div></div>
  <div class="row"><div class="swatch" style="background:rgba(244,243,238,0.72)"></div><div class="lbl">--wa-fg-2</div><div class="sample" style="color:rgba(244,243,238,0.72)">Secondary text · 72% — body copy</div></div>
  <div class="row"><div class="swatch" style="background:rgba(244,243,238,0.4)"></div><div class="lbl">--wa-fg-3</div><div class="sample" style="color:rgba(244,243,238,0.4)">Tertiary · 40% — labels &amp; eyebrows</div></div>
  <div class="row"><div class="swatch" style="background:rgba(244,243,238,0.3)"></div><div class="lbl">--wa-fg-4</div><div class="sample" style="color:rgba(244,243,238,0.3)">Quietest · 30% — footnotes &amp; version stamps</div></div>
</body></html>
