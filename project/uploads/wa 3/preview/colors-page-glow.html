<!doctype html>
<html><head><meta charset="utf-8"><title>Colors · Page glow</title>
<style>
  body{margin:0;height:100vh;
    background:radial-gradient(ellipse 1000px 600px at 90% -10%,rgba(255,61,82,0.08),transparent 60%),
              radial-gradient(ellipse 900px 500px at -10% 120%,rgba(122,61,255,0.08),transparent 60%),
              #08080a;
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;color:#f4f3ee;position:relative;overflow:hidden}
  .grain{position:absolute;inset:-40px;opacity:0.12;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.7'/></svg>")}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 50%,#000 30%,transparent 80%);
    mask-image:radial-gradient(ellipse 90% 70% at 50% 50%,#000 30%,transparent 80%)}
  .label{position:relative;z-index:2;text-align:center;font-size:11px;letter-spacing:2px;color:rgba(244,243,238,0.7);font-weight:700}
  .label .small{display:block;margin-top:6px;font-size:9.5px;color:rgba(244,243,238,0.4);letter-spacing:1.4px;font-weight:500}
</style></head>
<body>
  <div class="grid"></div>
  <div class="grain"></div>
  <div class="label">PAGE GLOW + GRID + GRAIN<span class="small">crimson top-right · violet bottom-left · 80px masked grid · turbulence noise overlay</span></div>
</body></html>
