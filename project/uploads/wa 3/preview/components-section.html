<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Eyebrow + section</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Fraunces:ital,wght@1,500&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:18px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.4px;font-weight:600;color:#FF3D52}
  h2{margin:0;font-size:48px;letter-spacing:-1.5px;font-weight:700;line-height:1.04}
  .frx{font-family:Fraunces,serif;font-style:italic;font-weight:500;color:#FF3D52}
  .sub{font-size:15px;line-height:1.55;color:rgba(244,243,238,0.6);max-width:540px;margin-top:6px}
</style></head>
<body>
  <div>
    <div class="eyebrow">02. CONSENSUS</div>
    <h2 style="margin-top:14px">Three reviewers, <span class="frx">one unanimous gate.</span></h2>
    <div class="sub">A code review you can trust because nobody writes and reviews their own work.</div>
  </div>
</body></html>
