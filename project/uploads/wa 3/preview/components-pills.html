<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Status pills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;font-family:'JetBrains Mono',monospace;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 32px;gap:14px}
  .pill{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);font-size:10.5px;letter-spacing:1.6px;font-weight:600;color:rgba(244,243,238,0.75)}
  .dot{width:7px;height:7px;border-radius:4px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .key{font-size:9.5px;letter-spacing:1.4px;color:rgba(244,243,238,0.4);text-transform:uppercase;margin-bottom:6px;font-weight:700}
</style></head>
<body>
  <div>
    <div class="key">— Live · accent · with glow</div>
    <div class="row">
      <span class="pill"><span class="dot" style="background:#FF3D52;box-shadow:0 0 10px #FF3D52"></span>LIVE · 23,479 SESSIONS</span>
      <span class="pill"><span class="dot" style="background:#FF3D52;box-shadow:0 0 10px #FF3D52"></span>RUN · 0X4F2A · IN-FLIGHT</span>
    </div>
  </div>
  <div>
    <div class="key">— Pass · fail · warn</div>
    <div class="row">
      <span class="pill"><span class="dot" style="background:#34D08C;box-shadow:0 0 10px #34D08C"></span>PASS · UNANIMOUS</span>
      <span class="pill"><span class="dot" style="background:#FF3D52;box-shadow:0 0 10px #FF3D52"></span>FAIL · 1 OF 3 BLOCKED</span>
      <span class="pill"><span class="dot" style="background:#FFB84D;box-shadow:0 0 10px #FFB84D"></span>WARN · BUDGET 84%</span>
    </div>
  </div>
  <div>
    <div class="key">— Mute · informational</div>
    <div class="row">
      <span class="pill"><span class="dot" style="background:rgba(244,243,238,0.4)"></span>v2.4 · GA</span>
      <span class="pill"><span class="dot" style="background:rgba(244,243,238,0.4)"></span>MIT · OPEN SOURCE</span>
      <span class="pill"><span class="dot" style="background:rgba(244,243,238,0.4)"></span>BETA · REQUEST ACCESS</span>
    </div>
  </div>
</body></html>
