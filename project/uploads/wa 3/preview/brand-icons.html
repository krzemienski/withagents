<!doctype html>
<html><head><meta charset="utf-8"><title>Brand · Iconography</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;font-family:'JetBrains Mono',monospace;height:100vh;display:flex;align-items:center;justify-content:center;padding:0 32px}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
  .ic{display:flex;flex-direction:column;align-items:center;gap:6px}
  .box{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center}
  .lbl{font-size:9px;letter-spacing:1px;color:rgba(244,243,238,0.4);text-transform:uppercase;font-weight:700}
  svg{stroke:rgba(244,243,238,0.85);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="grid">
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M13 2l7 7-9 9-5-5 7-11z"/><circle cx="15" cy="9" r="1.4"/><path d="M6 18l-3 3 4-1"/></svg></div><div class="lbl">rocket</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 7l4 10M17 7l-4 10M7 6h10"/></svg></div><div class="lbl">network</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></div><div class="lbl">check</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M10 18h4"/></svg></div><div class="lbl">phone</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="13" r="2"/><path d="M6 8v8M8 6h4a4 4 0 014 4v1"/></svg></div><div class="lbl">git</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5M3 17l9 5 9-5"/></svg></div><div class="lbl">stack</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1114 5"/><path d="M18 13v4h-4"/></svg></div><div class="lbl">loop</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 20h18M6 20V9l6-5 6 5v11"/><path d="M10 20v-4h4v4"/></svg></div><div class="lbl">mine</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 3 3 0 003-3v-1a2 2 0 012-2h1a3 3 0 003-3 9 9 0 00-9-9z"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="7" r="1"/><circle cx="16" cy="10" r="1"/></svg></div><div class="lbl">palette</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h6M8 13h8M8 17h4"/></svg></div><div class="lbl">yaml</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 7v10a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2z"/><path d="M8 5v2M12 5v2M16 5v2M8 19v-2M12 19v-2M16 19v-2"/></svg></div><div class="lbl">memory</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 20h4v-4H4zM10 16h4v-4h-4zM16 12h4V8h-4z"/></svg></div><div class="lbl">steps</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6L3 10l6-1z"/></svg></div><div class="lbl">skill</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3v8a4 4 0 01-8 0"/><circle cx="12" cy="16" r="4"/></svg></div><div class="lbl">hook</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10l3 2-3 2M12 14h5"/></svg></div><div class="lbl">term</div></div>
  <div class="ic"><div class="box"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3v18M6 7l-3 5 3 5M18 7l3 5-3 5"/></svg></div><div class="lbl">split</div></div>
</div>
</body></html>
