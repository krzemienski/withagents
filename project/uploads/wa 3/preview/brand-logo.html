<!doctype html>
<html><head><meta charset="utf-8"><title>Brand · Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;font-family:Inter,sans-serif;height:100vh;
    background:radial-gradient(ellipse 800px 500px at 90% -10%,rgba(255,61,82,0.08),transparent 60%),
              radial-gradient(ellipse 700px 400px at -10% 120%,rgba(122,61,255,0.08),transparent 60%),#08080a}
  .wrap{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;height:100vh;padding:0 40px}
  .mark{display:flex;flex-direction:column;align-items:center;gap:14px}
  .lockup{display:flex;align-items:center;gap:10px}
  .name{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:2.2px}
  .row{display:flex;gap:24px;align-items:center}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.4px;color:rgba(244,243,238,0.4);text-transform:uppercase;margin-top:8px;text-align:center}
</style></head>
<body>
<div class="wrap">
  <div class="row">
    <div class="mark">
      <svg width="80" height="80" viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="5" fill="#FF3D52"/><circle cx="16" cy="3" r="1.6" fill="#FF3D52"/><line x1="16" y1="4" x2="16" y2="7" stroke="#FF3D52" stroke-width="1.6" stroke-linecap="round"/><rect x="9" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="19" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="12" y="22" width="8" height="1.6" rx="0.8" fill="#0a0a0a"/></svg>
      <div class="lbl">WAMark</div>
    </div>
    <div class="mark">
      <svg width="32" height="32" viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="5" fill="#FF3D52"/><circle cx="16" cy="3" r="1.6" fill="#FF3D52"/><line x1="16" y1="4" x2="16" y2="7" stroke="#FF3D52" stroke-width="1.6" stroke-linecap="round"/><rect x="9" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="19" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="12" y="22" width="8" height="1.6" rx="0.8" fill="#0a0a0a"/></svg>
      <div class="lbl">32</div>
    </div>
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="5" fill="#FF3D52"/><circle cx="16" cy="3" r="1.6" fill="#FF3D52"/><line x1="16" y1="4" x2="16" y2="7" stroke="#FF3D52" stroke-width="1.6" stroke-linecap="round"/><rect x="9" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="19" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="12" y="22" width="8" height="1.6" rx="0.8" fill="#0a0a0a"/></svg>
      <div class="lbl">22 min</div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:18px">
    <div class="lockup">
      <svg width="26" height="26" viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="5" fill="#FF3D52"/><circle cx="16" cy="3" r="1.6" fill="#FF3D52"/><line x1="16" y1="4" x2="16" y2="7" stroke="#FF3D52" stroke-width="1.6" stroke-linecap="round"/><rect x="9" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="19" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="12" y="22" width="8" height="1.6" rx="0.8" fill="#0a0a0a"/></svg>
      <span class="name">WITHAGENTS</span>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1.4px;color:rgba(244,243,238,0.4);max-width:340px;line-height:1.6">
      Square robot head · accent-filled · cut-out eyes + slot mouth · antenna on top.<br>
      Always on dark. Pair with mono lockup at 11.5px / 2.2 tracking.
    </div>
  </div>
</div>
</body></html>
