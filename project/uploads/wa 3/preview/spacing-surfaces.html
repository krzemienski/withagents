<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing · Surfaces</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;font-family:'JetBrains Mono',monospace;height:100vh;display:flex;align-items:center;gap:14px;padding:0 32px;justify-content:center}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;max-width:170px}
  .box{width:100%;height:90px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:1.2px;color:rgba(244,243,238,0.4);font-weight:700}
  .lbl{font-size:9.5px;letter-spacing:1.4px;color:rgba(244,243,238,0.5);text-align:center;font-weight:700}
  .px{font-size:9px;letter-spacing:1px;color:rgba(244,243,238,0.3);text-align:center}
</style></head>
<body>
  <div class="col"><div class="box" style="background:rgba(255,255,255,0.02)">FILL · 02</div><div class="lbl">QUIETEST</div><div class="px">var(--wa-fill-1)</div></div>
  <div class="col"><div class="box" style="background:rgba(255,255,255,0.04)">FILL · 04</div><div class="lbl">STANDARD CARD</div><div class="px">var(--wa-fill-2)</div></div>
  <div class="col"><div class="box" style="background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.12)">FILL · 05</div><div class="lbl">HOVER</div><div class="px">var(--wa-fill-3)</div></div>
  <div class="col"><div class="box" style="background:rgba(255,255,255,0.08)">FILL · 08</div><div class="lbl">EMPHASIS</div><div class="px">var(--wa-fill-4)</div></div>
</body></html>
