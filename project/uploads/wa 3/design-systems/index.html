<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WithAgents · Five Design Systems</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,600;0,800;1,400;1,600;1,800&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-systems.jsx"></script>
<script type="text/babel" src="diagrams.jsx"></script>
<script type="text/babel" src="showcase-hero.jsx"></script>
<script type="text/babel" src="showcase-tokens.jsx"></script>
<script type="text/babel" src="showcase-components.jsx"></script>
<script type="text/babel" src="showcase-diagrams.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [systemId, setSystemId] = useState(() =>
    localStorage.getItem('wa-system') || 'journal');
  const [accentId, setAccentId] = useState(() =>
    localStorage.getItem('wa-accent') ||
    window.WA_SYSTEM_DEFAULT_ACCENT[systemId] || 'crimson');

  // Apply tokens any time either changes.
  useEffect(() => {
    window.applyWADesignSystem(systemId, accentId);
    localStorage.setItem('wa-system', systemId);
    localStorage.setItem('wa-accent', accentId);
  }, [systemId, accentId]);

  // When system changes, snap accent to that system's preferred default
  // — but only if the user hasn't manually picked one yet this session.
  const handleSystem = (id) => {
    setSystemId(id);
    if (!localStorage.getItem('wa-accent-locked')) {
      setAccentId(window.WA_SYSTEM_DEFAULT_ACCENT[id] || 'crimson');
    }
  };
  const handleAccent = (id) => {
    setAccentId(id);
    localStorage.setItem('wa-accent-locked', '1');
  };

  return (
    <div className="page">
      <div className="grain" />
      <WAStickyBar
        systemId={systemId}
        accentId={accentId}
        onSystem={handleSystem}
        onAccent={handleAccent} />
      <main className="ds-shell">
        <WAHero systemId={systemId} />
        <WASystemIndex systemId={systemId} onSystem={handleSystem} />
        <WATypeSection systemId={systemId} />
        <WAColorSection systemId={systemId} accentId={accentId} />
        <WAGeometrySection />
        <WAComponentsSection />
        <WACardsSection />
        <WACodeSection />
        <WADiagramsSection systemId={systemId} accentId={accentId} />
        <WAFooter systemId={systemId} />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
