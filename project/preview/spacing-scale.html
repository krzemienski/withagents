<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing · Scale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;font-family:'JetBrains Mono',monospace;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:14px}
  .row{display:flex;align-items:center;gap:14px;height:18px}
  .key{font-size:10px;letter-spacing:1.2px;color:rgba(244,243,238,0.5);width:90px;flex-shrink:0;font-weight:700}
  .px{font-size:9.5px;letter-spacing:1px;color:rgba(244,243,238,0.4);width:48px;text-align:right;flex-shrink:0}
  .bar{height:14px;background:#FF3D52;border-radius:3px}
</style></head>
<body>
  <div class="row"><div class="key">space-1</div><div class="px">4</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="key">space-2</div><div class="px">8</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="key">space-3</div><div class="px">12</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="key">space-4</div><div class="px">16</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="key">space-5</div><div class="px">24</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="key">space-6</div><div class="px">32</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="key">space-7</div><div class="px">48</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="key">space-8</div><div class="px">72</div><div class="bar" style="width:72px"></div></div>
  <div class="row"><div class="key">space-9</div><div class="px">120</div><div class="bar" style="width:120px"></div></div>
</body></html>
