<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Stats row</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;height:100vh;display:flex;align-items:center;padding:0 32px;justify-content:center;gap:0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;width:100%;max-width:680px;border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06)}
  .stat{padding:22px 18px;border-right:1px solid rgba(255,255,255,0.06);text-align:left}
  .stat:last-child{border-right:none}
  .v{font-family:Inter,sans-serif;font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1}
  .l{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.6px;color:rgba(244,243,238,0.4);text-transform:uppercase;margin-top:8px;font-weight:700}
  .acc{color:#FF3D52}
</style></head>
<body>
  <div class="grid">
    <div class="stat"><div class="v">23,479</div><div class="l">SESSIONS</div></div>
    <div class="stat"><div class="v">3.47<span style="font-size:24px;color:rgba(244,243,238,0.5)">M</span></div><div class="l">LINES</div></div>
    <div class="stat"><div class="v">27</div><div class="l">PROJECTS</div></div>
    <div class="stat"><div class="v acc">42</div><div class="l">DAYS</div></div>
  </div>
</body></html>
