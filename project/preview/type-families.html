<!doctype html>
<html><head><meta charset="utf-8"><title>Type · Families</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Fraunces:ital,wght@0,400;1,500&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:24px}
  .row{display:flex;align-items:baseline;gap:24px}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.4px;color:rgba(244,243,238,0.4);width:180px;flex-shrink:0;text-transform:uppercase}
  .specimen{font-size:48px;line-height:1}
</style></head>
<body>
  <div class="row"><div class="lbl">Inter · UI &amp; body</div><div class="specimen" style="font-family:Inter;font-weight:700">Aa Rg 19</div></div>
  <div class="row"><div class="lbl">Fraunces · italic only</div><div class="specimen" style="font-family:Fraunces;font-style:italic;font-weight:500;color:#FF3D52">Aa Rg 19</div></div>
  <div class="row"><div class="lbl">JetBrains Mono · labels</div><div class="specimen" style="font-family:'JetBrains Mono',monospace;font-weight:700">Aa Rg 19</div></div>
</body></html>
