<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Code block</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#08080a;color:#f4f3ee;font-family:'JetBrains Mono',monospace;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:14px}
  .block{background:#101013;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden}
  .head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:9.5px;letter-spacing:1.4px;font-weight:600;color:rgba(244,243,238,0.5);text-transform:uppercase}
  .head .right{display:flex;align-items:center;gap:6px}
  .body{padding:14px 16px;font-size:13px;line-height:1.55;color:rgba(244,243,238,0.85)}
  .kw{color:#B84DFF}.str{color:#34D08C}.com{color:rgba(244,243,238,0.35)}.bad{color:#FF3D52}.good{color:#34D08C}
  .dot{width:7px;height:7px;border-radius:4px}
</style></head>
<body>
  <div class="block">
    <div class="head"><span>STREAMING HANDLER · WRONG</span><div class="right"><span class="dot" style="background:#FF3D52;box-shadow:0 0 10px #FF3D52"></span><span style="color:#FF3D52">FAIL</span></div></div>
    <div class="body">message.text <span class="bad">+=</span> textBlock.text</div>
  </div>
  <div class="block">
    <div class="head"><span>STREAMING HANDLER · RIGHT</span><div class="right"><span class="dot" style="background:#34D08C;box-shadow:0 0 10px #34D08C"></span><span style="color:#34D08C">PASS</span></div></div>
    <div class="body">message.text <span class="good">=</span> textBlock.text</div>
  </div>
</body></html>
