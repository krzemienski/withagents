<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Nav</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
  body{margin:0;background:radial-gradient(ellipse 800px 500px at 90% -10%,rgba(255,61,82,0.08),transparent 60%),#08080a;color:#f4f3ee;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 28px}
  .nav{display:flex;align-items:center;height:56px;background:rgba(8,8,10,0.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:0 20px;gap:24px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .name{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.2px;font-weight:700}
  nav{flex:1;display:flex;justify-content:flex-end;gap:24px;font-size:13px;color:rgba(244,243,238,0.68)}
  nav a{cursor:pointer;text-decoration:none}
  nav a.active{color:#f4f3ee;font-weight:600}
  .key{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.4px;color:rgba(244,243,238,0.4);text-transform:uppercase;margin-top:14px;font-weight:700;text-align:center}
</style></head>
<body>
  <div class="nav">
    <a class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="5" fill="#FF3D52"/><circle cx="16" cy="3" r="1.6" fill="#FF3D52"/><line x1="16" y1="4" x2="16" y2="7" stroke="#FF3D52" stroke-width="1.6" stroke-linecap="round"/><rect x="9" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="19" y="13" width="4" height="6" rx="1.2" fill="#0a0a0a"/><rect x="12" y="22" width="8" height="1.6" rx="0.8" fill="#0a0a0a"/></svg>
      <span class="name">WITHAGENTS</span>
    </a>
    <nav>
      <a class="active">Writing</a>
      <a>Products</a>
      <a>About</a>
      <a>GitHub ↗</a>
    </nav>
  </div>
  <div class="key">— STICKY · BLUR(14) · 1PX HAIRLINE BORDER</div>
</body></html>
