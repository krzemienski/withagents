<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WithAgents · UI Kit Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:ital,wght@1,400..700&display=swap" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 0; }
    section { padding: 64px 28px; border-bottom: 1px solid var(--wa-line); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    @media (max-width: 880px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="wa-page">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="Components.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <div>
          <WANav current="series" />

          <section>
            <WAEyebrow num={1} label="Foundations" />
            <h1 className="wa-page-title" style={{ marginBottom: 14 }}>
              A field journal for people building <span className="wa-display">real</span> agent systems.
            </h1>
            <div className="wa-body" style={{ maxWidth: 620, marginBottom: 28 }}>
              Hyper-black editorial. Numbers up front. Hand-wavy claims out. Distilled from the WithAgents site, ready to compose.
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <WAStatusPill label="SYSTEM STATUS · NOMINAL" />
              <WAStatusPill label="VER 0.1.0 · 24 TOKENS" />
            </div>
          </section>

          <section>
            <WAEyebrow num={2} label="Posts" />
            <div className="grid-3">
              <PostCard num={1} title="23,479 Sessions: What Actually Works"
                subtitle="What 11.6GB of session data across 27 projects reveals about building production software with AI agents."
                read="16 min" tags={['Multi-Agent', 'ClaudeCode']} />
              <PostCard num={2} title="3 Agents Found the Bug 1 Agent Missed"
                subtitle="Why multi-agent consensus catches what solo review cannot — including the +=/= bug from line 926."
                read="18 min" tags={['Consensus', 'CodeReview']} />
              <PostCard num={3} title="I Banned Unit Tests and Shipped Faster"
                subtitle="Why functional validation through real UI replaces unit tests for agent-written code."
                read="14 min" tags={['Validation', 'Functional']} />
            </div>
          </section>

          <section>
            <WAEyebrow num={3} label="Products" />
            <div className="grid-2">
              <ProductCard kicker="Multi-agent consensus" name="Anneal"
                blurb="Three reviewers, unanimous vote. $0.15 per gate. The code-review pattern that caught a 3-day-old bug." />
              <ProductCard kicker="Cross-session memory" name="Memory Layer"
                blurb="An SQLite-backed observation store with semantic search. Cut repeated mistakes by 73%." />
            </div>
          </section>

          <section>
            <WAEyebrow num={4} label="Diagrams" />
            <GateDiagram />
          </section>

          <WAFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
